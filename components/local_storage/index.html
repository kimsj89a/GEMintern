<!DOCTYPE html>
<html>
<head>
    <style>body { margin: 0; padding: 0; overflow: hidden; }</style>
</head>
<body>
<script>
    // Minimal Streamlit Component - localStorage bridge
    // Uses raw postMessage API (no external lib needed)

    function sendMsg(type, data) {
        window.parent.postMessage(
            Object.assign({isStreamlitMessage: true, type: type}, data || {}),
            "*"
        );
    }

    // Signal component is ready
    sendMsg("streamlit:componentReady", {apiVersion: 1});
    sendMsg("streamlit:setFrameHeight", {height: 0});

    // Handle render events from Streamlit
    window.addEventListener("message", function(event) {
        if (!event.data || event.data.type !== "streamlit:render") return;

        var args = event.data.args || {};
        var storageKey = args.storage_key || "";
        var saveValue = args.save_value;

        try {
            // If save_value is provided, save it first
            if (saveValue !== undefined && saveValue !== null) {
                if (saveValue === "") {
                    localStorage.removeItem(storageKey);
                } else {
                    localStorage.setItem(storageKey, saveValue);
                }
            }

            // Always return the current stored value
            var stored = localStorage.getItem(storageKey);
            sendMsg("streamlit:setComponentValue", {value: stored || ""});
        } catch (e) {
            // localStorage may be disabled (private browsing, etc.)
            sendMsg("streamlit:setComponentValue", {value: ""});
        }

        sendMsg("streamlit:setFrameHeight", {height: 0});
    });
</script>
</body>
</html>
